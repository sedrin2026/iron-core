<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>IRON CORE</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <!-- ヘッダー -->
    <header class="app-header">
      <div class="brand">
        <div class="brand-mark">IC</div>
        <div class="brand-text">
          <strong>IRON CORE</strong><br>
          <span>BODY METRICS</span>
        </div>
      </div>
      <button class="icon-button">⚙️</button>
    </header>

    <!-- メインコンテンツエリア -->
    <main>
      <section class="screen active">
        
        <!-- プロフィールパネル -->
        <div class="body-profile-panel">
          <div class="inline-profile-grid">
            <div class="inline-profile-field">
              <span>身長</span>
              <input type="number" value="175">
            </div>
            <div class="inline-profile-field">
              <span>体重</span>
              <input type="number" value="70">
            </div>
            <div class="inline-profile-field">
              <span>体脂肪</span>
              <input type="number" value="14">
            </div>
            <div class="inline-profile-field">
              <span>BMI</span>
              <input type="number" value="22.8" readonly>
            </div>
            <button class="inline-profile-save">保存</button>
          </div>
        </div>

        <!-- 人型模型・3Dポリゴンワイヤーフレーム表示領域 -->
        <div class="wireframe-card">
          <div class="wireframe-container">
            <svg class="cyber-wireframe" viewBox="0 0 200 440" xmlns="http://www.w3.org/2000/svg">
              <defs>
                <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
                  <feGaussianBlur stdDeviation="1.2" result="blur" />
                  <feMerge>
                    <feMergeNode in="blur" />
                    <feMergeNode in="SourceGraphic" />
                  </feMerge>
                </filter>
              </defs>

              <g stroke="#00e5ff" stroke-width="0.9" fill="rgba(0, 229, 255, 0.03)" filter="url(#glow)">
                
                <!-- 【頭部】人型模型のローポリメッシュ -->
                <polygon points="100,20 114,28 110,48 100,56 90,48 86,28" />
                <polygon points="100,20 114,28 100,38" />
                <polygon points="100,20 86,28 100,38" />
                <polygon points="114,28 110,48 100,38" />
                <polygon points="86,28 90,48 100,38" />
                <polygon points="110,48 100,56 100,38" />
                <polygon points="90,48 100,56 100,38" />

                <!-- 首（関節ジョイント） -->
                <polygon points="94,56 106,56 104,66 96,66" />

                <!-- 【胸郭・胸部ポリゴンブロック】 -->
                <polygon points="100,66 65,76 72,125 100,132" />
                <polygon points="100,66 135,76 128,125 100,132" />
                <polygon points="65,76 100,66 100,98" />
                <polygon points="135,76 100,66 100,98" />
                <polygon points="65,76 72,125 100,98" />
                <polygon points="135,76 128,125 100,98" />
                <polygon points="72,125 100,132 100,98" />
                <polygon points="128,125 100,132 100,98" />

                <!-- 【腹筋・体幹ポリゴン】 -->
                <polygon points="72,125 100,132 100,175 76,170" />
                <polygon points="128,125 100,132 100,175 124,170" />
                <polygon points="72,125 76,170 100,150" />
                <polygon points="128,125 124,170 100,150" />
                <polygon points="100,132 100,175 100,150" />

                <!-- 【骨盤ブロック】 -->
                <polygon points="76,170 124,170 118,210 82,210" />
                <polygon points="76,170 100,170 100,210 82,210" />
                <polygon points="124,170 100,170 100,210 118,210" />
                <polygon points="76,170 124,170 100,190" />
                <polygon points="82,210 118,210 100,190" />

                <!-- 【肩関節球体】 -->
                <polygon points="65,76 52,82 58,98 68,92" />
                <polygon points="135,76 148,82 142,98 132,92" />

                <!-- 【上腕（右・左）ポリゴン】 -->
                <polygon points="52,82 38,130 48,135 58,98" />
                <polygon points="52,82 48,135 45,105" />
                <polygon points="148,82 162,130 152,135 142,98" />
                <polygon points="148,82 152,135 155,105" />

                <!-- 【肘関節】 -->
                <circle cx="43" cy="132.5" r="4" />
                <circle cx="157" cy="132.5" r="4" />

                <!-- 【前腕（右・左）ポリゴン】 -->
                <polygon points="38,135 25,185 34,188 48,138" />
                <polygon points="162,135 175,185 166,188 152,138" />

                <!-- 【股関節（球体関節）】 -->
                <circle cx="82" cy="215" r="6" />
                <circle cx="118" cy="215" r="6" />

                <!-- 【太もも（右・左）ポリゴン】 -->
                <polygon points="76,218 88,218 92,300 74,300" />
                <polygon points="76,218 92,300 83,260" />
                <polygon points="124,218 112,218 108,300 126,300" />
                <polygon points="124,218 108,300 117,260" />

                <!-- 【膝関節】 -->
                <circle cx="83" cy="305" r="5" />
                <circle cx="117" cy="305" r="5" />

                <!-- 【すね・ふくらはぎ（右・左）ポリゴン】 -->
                <polygon points="76,310 90,310 86,395 78,395" />
                <polygon points="76,310 86,395 82,350" />
                <polygon points="124,310 110,310 114,395 122,395" />
                <polygon points="124,310 114,395 118,350" />

                <!-- 【足首・足先】 -->
                <polygon points="78,395 86,395 88,415 74,415" />
                <polygon points="122,395 114,395 112,415 126,415" />

              </g>

              <!-- スキャンレーザー -->
              <line class="scan-line" x1="10" y1="0" x2="190" y2="0" stroke="rgba(0, 229, 255, 0.9)" stroke-width="1.8" />
            </svg>
          </div>
          <div class="status-tag">3D POLYGON MODEL ACTIVE</div>
        </div>

      </section>
    </main>

    <!-- フッターナビゲーション -->
    <nav class="bottom-nav">
      <button class="nav-button active"><span>🏠</span><small>ホーム</small></button>
      <button class="nav-button"><span>💪</span><small>筋トレ</small></button>
      <button class="nav-button"><span>📊</span><small>記録</small></button>
      <button class="nav-button"><span>👤</span><small>ボディ</small></button>
      <button class="nav-button"><span>⚙️</span><small>設定</small></button>
    </nav>
  </div>

  <script src="app.js"></script>
</body>
</html>

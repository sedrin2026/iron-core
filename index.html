<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#03070c">
<title>IRON-CORE</title>
<style>
:root{
  --bg:#02060b; --panel:#071421; --panel2:#0a1b2b; --cyan:#20d9ff;
  --cyan2:#66ecff; --purple:#9b5cff; --pink:#ff3fb4; --text:#f3f8ff; --muted:#7d91a6;
  --line:rgba(32,217,255,.42); --shadow:0 0 24px rgba(32,217,255,.12);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:
 radial-gradient(circle at 50% -10%,rgba(18,80,120,.28),transparent 42%),
 linear-gradient(180deg,#03070c,#02050a 70%,#010307);color:var(--text);
 font-family:Inter,"Noto Sans JP",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{overflow-x:hidden}
button,input,select{font:inherit}
button{cursor:pointer}
.app{width:min(100%,760px);margin:auto;padding:14px 14px 94px}
.topbar{height:74px;display:flex;align-items:center;justify-content:space-between;
 border:1px solid rgba(32,217,255,.34);border-radius:18px;padding:10px 16px;
 background:linear-gradient(180deg,rgba(7,20,32,.96),rgba(2,8,14,.96));
 box-shadow:var(--shadow);position:relative;overflow:hidden}
.topbar:after{content:"";position:absolute;inset:0;pointer-events:none;
 background:linear-gradient(110deg,transparent 0 43%,rgba(32,217,255,.08) 50%,transparent 57%)}
.brand{letter-spacing:.13em;font-weight:900;font-size:25px}
.brand span{color:var(--cyan);text-shadow:0 0 16px rgba(32,217,255,.7)}
.brandLogoWrap{flex:1;display:flex;justify-content:center;align-items:center}.brandLogo{display:block;width:min(100%,500px);height:auto;object-fit:contain}.tag{font-size:9px;letter-spacing:.2em;color:var(--muted);margin-top:2px}
.hud{width:34px;height:34px;border:1px solid var(--line);border-radius:10px;display:grid;place-items:center;color:var(--cyan);font-size:18px}
.hero{margin-top:14px;height:clamp(190px,44vw,340px);border:1px solid var(--cyan);border-radius:20px;overflow:hidden;position:relative;
 background:#07111b center/cover no-repeat url("hero-banner.png");
 box-shadow:0 0 28px rgba(32,217,255,.14),inset 0 0 40px rgba(0,0,0,.35)}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.2),transparent 50%,rgba(0,0,0,.2))}
.heroTitle{position:absolute;z-index:2;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;white-space:nowrap;text-shadow:0 2px 18px #000}
.heroTitle b{font-size:clamp(24px,6vw,46px);letter-spacing:.12em}
.heroTitle small{display:block;font-size:10px;letter-spacing:.28em;color:var(--cyan2);margin-top:5px}
.section{margin-top:14px}
.wide{width:100%;min-height:92px;border:1px solid var(--cyan);border-radius:18px;
 background:linear-gradient(110deg,#07192a,#0a1624 55%,#06111d);color:var(--text);
 display:flex;align-items:center;gap:16px;padding:16px 20px;position:relative;overflow:hidden;
 box-shadow:0 0 20px rgba(32,217,255,.08)}
.wide:before{content:"";position:absolute;left:0;top:0;width:34%;height:2px;background:linear-gradient(90deg,var(--cyan),transparent)}
.wideIcon{width:52px;height:52px;border-radius:14px;border:1px solid var(--cyan);display:grid;place-items:center;
 color:var(--cyan);font-size:26px;background:rgba(32,217,255,.06);box-shadow:0 0 18px rgba(32,217,255,.12)}
.wideText{flex:1;text-align:left}.wideText b{display:block;font-size:18px;letter-spacing:.06em}.wideText small{color:var(--muted);font-size:9px;letter-spacing:.16em}
.chev{font-size:28px;color:var(--cyan)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile{min-width:0;aspect-ratio:1/1;border:1px solid rgba(32,217,255,.48);border-radius:17px;
 background:linear-gradient(145deg,rgba(9,27,43,.96),rgba(3,11,18,.98));display:flex;flex-direction:column;
 align-items:center;justify-content:center;padding:10px;text-align:center;position:relative;overflow:hidden;
 box-shadow:inset 0 0 22px rgba(32,217,255,.035);transition:.18s}
.tile:before{content:"";position:absolute;inset:5px;border:1px solid rgba(32,217,255,.08);border-radius:12px;pointer-events:none}
.tile:active{transform:scale(.97);border-color:var(--cyan);box-shadow:0 0 18px rgba(32,217,255,.22)}
.tile .ico{font-size:32px;line-height:1;color:var(--cyan);filter:drop-shadow(0 0 7px rgba(32,217,255,.55));margin-bottom:12px}
.tile b{font-size:13px;white-space:nowrap}.tile small{font-size:8px;letter-spacing:.11em;color:var(--muted);margin-top:4px;white-space:nowrap}
.coach{border-color:rgba(155,92,255,.72);background:linear-gradient(110deg,#0c1024,#08182a,#120c23);
 box-shadow:0 0 24px rgba(155,92,255,.12)}
.coach .wideIcon{border-color:var(--purple);color:#cba9ff;box-shadow:0 0 18px rgba(155,92,255,.2)}
.coach .wideText b{color:#d9c6ff}.coach .wideText small{color:#a88bd2}
.coachCard{margin-top:10px;border:1px solid rgba(155,92,255,.4);border-radius:16px;padding:14px;background:rgba(7,9,20,.75)}
.coachHead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.status{font-size:9px;color:#bba3e9;letter-spacing:.12em}.advice{margin-top:9px;line-height:1.65;font-size:13px;color:#dce3ef}
.mini{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.pill{font-size:9px;border:1px solid rgba(155,92,255,.38);padding:5px 8px;border-radius:99px;color:#cdb8f5}
.nav{position:fixed;z-index:20;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,760px);
 background:rgba(2,6,11,.94);backdrop-filter:blur(12px);border-top:1px solid rgba(32,217,255,.25);
 display:grid;grid-template-columns:repeat(5,1fr);padding:8px 8px max(8px,env(safe-area-inset-bottom))}
.nav button{background:none;border:0;color:#66788a;font-size:9px;display:flex;flex-direction:column;align-items:center;gap:3px}
.nav button span{font-size:20px}.nav .active{color:var(--cyan);text-shadow:0 0 10px rgba(32,217,255,.45)}
.modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.72);backdrop-filter:blur(8px);display:none;align-items:flex-end;justify-content:center}
.modal.show{display:flex}
.sheet{width:min(100%,760px);max-height:90vh;overflow:auto;background:linear-gradient(180deg,#071421,#02070d);
 border:1px solid rgba(32,217,255,.5);border-bottom:0;border-radius:22px 22px 0 0;padding:20px 16px 30px;box-shadow:0 -10px 50px rgba(32,217,255,.12)}
.sheet h2{margin:0 0 5px;font-size:20px}.sheet p{margin:0 0 18px;color:var(--muted);font-size:11px}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{font-size:10px;color:#8da3b8;display:block}.field{margin-top:5px;width:100%;background:#06101a;color:#fff;border:1px solid rgba(32,217,255,.26);border-radius:10px;padding:10px;outline:none}
.field:focus{border-color:var(--cyan);box-shadow:0 0 10px rgba(32,217,255,.1)}
.actions{display:flex;gap:10px;margin-top:16px}.primary,.secondary{flex:1;border-radius:11px;padding:12px;border:1px solid var(--cyan)}
.primary{background:var(--cyan);color:#001018;font-weight:800}.secondary{background:transparent;color:var(--text);border-color:#34495b}
@media(max-width:420px){.app{padding-left:10px;padding-right:10px}.grid{gap:7px}.tile{border-radius:13px}.tile .ico{font-size:27px;margin-bottom:8px}.tile b{font-size:11px}.tile small{font-size:7px}.wide{padding:13px 14px}.wideText b{font-size:16px}}
</style>
</head>
<body>
<main class="app">
  <header class="topbar">
    <div class="brandLogoWrap"><img class="brandLogo" src="IRON-CORE-logo-exact.png" alt="IRON-CORE"></div>
    <div class="hud">⌁</div>
  </header>

  <section class="hero">
    <div class="heroTitle"><b>IRON-CORE</b><small>UNLEASH YOUR POTENTIAL</small></div>
  </section>

  <section class="section">
    <button class="wide" id="openProfile">
      <div class="wideIcon">♙</div>
      <div class="wideText"><b>身体データを登録</b><small>PERSONAL BODY PROFILE</small></div>
      <div class="chev">›</div>
    </button>
  </section>

  <section class="section grid">
    <button class="tile"><div class="ico">⚒</div><b>トレーニング</b><small>WORKOUT</small></button>
    <button class="tile"><div class="ico">☷</div><b>トレーニング記録</b><small>WORKOUT LOG</small></button>
    <button class="tile"><div class="ico">▥</div><b>進捗グラフ</b><small>PROGRESS</small></button>
    <button class="tile"><div class="ico">♜</div><b>食事管理</b><small>NUTRITION</small></button>
    <button class="tile"><div class="ico">◉</div><b>体重管理</b><small>BODY TRACKING</small></button>
    <button class="tile"><div class="ico">◎</div><b>目標設定</b><small>GOAL SETTING</small></button>
    <button class="tile"><div class="ico">▱</div><b>トレーニング解説</b><small>EXERCISE GUIDE</small></button>
    <button class="tile"><div class="ico">♜</div><b>実績・バッジ</b><small>ACHIEVEMENT</small></button>
    <button class="tile"><div class="ico">⚙</div><b>設定</b><small>SETTINGS</small></button>
  </section>

  <section class="section">
    <button class="wide coach" id="openCoach">
      <div class="wideIcon">✦</div>
      <div class="wideText"><b>AI COACH <span style="font-size:12px">（AIトレーナー）</span></b><small>PERSONALIZED TRAINING INTELLIGENCE</small></div>
      <div class="chev">›</div>
    </button>
    <div class="coachCard">
      <div class="coachHead"><strong id="coachTitle">AI COACH // READY</strong><span class="status" id="coachStatus">PROFILE REQUIRED</span></div>
      <div class="advice" id="coachAdvice">身体データを登録すると、年齢・性別・身長・体重・各部位サイズ・血圧・目標などを基に、あなた専用のトレーニング方針を生成します。</div>
      <div class="mini" id="coachPills"><span class="pill">PERSONALIZED</span><span class="pill">DATA DRIVEN</span><span class="pill">GOAL BASED</span></div>
    </div>
  </section>
</main>

<nav class="nav">
  <button class="active"><span>⌂</span>ホーム</button>
  <button><span>□</span>カレンダー</button>
  <button><span>＋</span>記録する</button>
  <button><span>▥</span>分析</button>
  <button><span>♙</span>マイページ</button>
</nav>

<div class="modal" id="modal">
  <div class="sheet">
    <h2>PERSONAL BODY PROFILE</h2>
    <p>身体データを入力すると、AI COACHが個体差を考慮した提案を行います。</p>
    <div class="formgrid">
      <label>年齢<input class="field" id="age" type="number" min="10" max="100" placeholder="例：30"></label>
      <label>性別<select class="field" id="sex"><option value="">選択</option><option>男性</option><option>女性</option></select></label>
      <label>身長 (cm)<input class="field" id="height" type="number" step="0.1" placeholder="170"></label>
      <label>体重 (kg)<input class="field" id="weight" type="number" step="0.1" placeholder="65"></label>
      <label>腕周り (cm)<input class="field" id="arm" type="number" step="0.1" placeholder="32"></label>
      <label>ウエスト (cm)<input class="field" id="waist" type="number" step="0.1" placeholder="75"></label>
      <label>ヒップ (cm)<input class="field" id="hip" type="number" step="0.1" placeholder="90"></label>
      <label>太もも (cm)<input class="field" id="thigh" type="number" step="0.1" placeholder="52"></label>
      <label>血圧 上 (mmHg)<input class="field" id="bpSys" type="number" placeholder="120"></label>
      <label>血圧 下 (mmHg)<input class="field" id="bpDia" type="number" placeholder="80"></label>
      <label style="grid-column:1/-1">目的<select class="field" id="goal"><option>筋肥大</option><option>減量</option><option>ボディメイク</option><option>筋力アップ</option><option>健康・体力維持</option></select></label>
    </div>
    <div class="actions"><button class="secondary" id="closeModal">キャンセル</button><button class="primary" id="saveProfile">登録してAI分析</button></div>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
const modal=$("modal");
function openModal(){modal.classList.add("show")}
function closeModal(){modal.classList.remove("show")}
$("openProfile").onclick=openModal;
$("openCoach").onclick=openModal;
$("closeModal").onclick=closeModal;
modal.addEventListener("click",e=>{if(e.target===modal)closeModal()});

function updateCoach(p){
  if(!p){return}
  const bmi=p.height&&p.weight ? p.weight/((p.height/100)**2) : null;
  let advice=`${p.goal}を目的として、現在の身体データを基準にトレーニング負荷と回復量を個別最適化します。`;
  if(bmi){
    advice+=` BMI目安は ${bmi.toFixed(1)}。体重だけで判断せず、各部位サイズとトレーニング履歴を組み合わせて変化を追跡します。`;
  }
  if(p.bpSys&&p.bpDia && (p.bpSys>=140 || p.bpDia>=90)){
    advice+=" 血圧値が高めに入力されています。運動強度については医療専門家への相談を優先してください。";
  }
  $("coachTitle").textContent="AI COACH // PERSONALIZED";
  $("coachStatus").textContent="PROFILE ACTIVE";
  $("coachAdvice").textContent=advice;
  $("coachPills").innerHTML=`<span class="pill">${p.goal}</span><span class="pill">${p.weight||"--"} KG</span><span class="pill">${p.age||"--"} Y/O</span>`;
}
$("saveProfile").onclick=()=>{
  const p={age:$("age").value,sex:$("sex").value,height:$("height").value,weight:$("weight").value,arm:$("arm").value,waist:$("waist").value,hip:$("hip").value,thigh:$("thigh").value,bpSys:$("bpSys").value,bpDia:$("bpDia").value,goal:$("goal").value};
  localStorage.setItem("ironCoreProfile",JSON.stringify(p)); updateCoach(p); closeModal();
};
try{const p=JSON.parse(localStorage.getItem("ironCoreProfile")); if(p) updateCoach(p)}catch(e){}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>IRON CORE</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <!-- ヘッダー -->
    <header class="app-header">
      <div class="brand">
        <div class="brand-mark">IC</div>
        <div class="brand-text">
          <strong>IRON CORE</strong><br>
          <span>BODY METRICS</span>
        </div>
      </div>
      <button class="icon-button">⚙️</button>
    </header>

    <!-- メインコンテンツエリア -->
    <main>
      <section class="screen active">
        
        <!-- プロフィールパネル -->
        <div class="body-profile-panel">
          <div class="inline-profile-grid">
            <div class="inline-profile-field">
              <span>身長</span>
              <input type="number" value="170">
            </div>
            <div class="inline-profile-field">
              <span>体重</span>
              <input type="number" value="65">
            </div>
            <div class="inline-profile-field">
              <span>体脂肪</span>
              <input type="number" value="15">
            </div>
            <div class="inline-profile-field">
              <span>BMI</span>
              <input type="number" value="22.5" readonly>
            </div>
            <button class="inline-profile-save">保存</button>
          </div>
        </div>

        <!-- リアル人型ワイヤーフレーム表示領域 -->
        <div class="wireframe-card">
          <div class="wireframe-container">
            <svg class="cyber-wireframe" viewBox="0 0 200 440" xmlns="http://www.w3.org/2000/svg">
              <defs>
                <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
                  <feGaussianBlur stdDeviation="1.5" result="blur" />
                  <feMerge>
                    <feMergeNode in="blur" />
                    <feMergeNode in="SourceGraphic" />
                  </feMerge>
                </filter>
              </defs>

              <g stroke="#00e5ff" fill="none" filter="url(#glow)">
                <!-- リアルな人体外郭シルエット -->
                <path d="
                  M 100,20 
                  C 107,20 114,26 114,38 
                  C 114,50 107,56 100,58 
                  C 93,56 86,50 86,38 
                  C 86,26 93,20 100,20 Z
                  
                  M 89,56 C 88,64 78,70 65,74 C 58,76 50,86 46,105 C 42,124 40,150 36,170 C 33,185 32,200 36,205 C 38,208 43,195 47,175 C 50,160 52,140 56,128 C 58,122 62,120 64,128 C 68,144 71,175 75,190 C 78,200 80,210 78,225 C 76,238 72,255 70,270 C 67,290 68,320 72,350 C 74,365 73,390 70,410 C 69,415 72,418 77,418 C 82,418 85,410 87,395 C 91,370 94,330 94,300 C 94,270 98,245 100,240
                  C 102,245 106,270 106,300 C 106,330 109,370 113,395 C 115,410 118,418 123,418 C 128,418 131,415 130,410 C 127,390 126,365 128,350 C 132,320 133,290 130,270 C 128,255 124,238 122,225 C 120,210 122,200 125,190 C 129,175 132,144 136,128 C 138,120 142,122 144,128 C 148,140 150,160 153,175 C 157,195 162,208 164,205 C 168,200 167,185 164,170 C 160,150 158,124 154,105 C 150,86 142,76 135,74 C 122,70 112,64 111,56
                " stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" />

                <!-- 胸筋・腹筋・解剖学的ライン -->
                <path d="M 100,58 L 100,220" stroke-width="0.8" stroke-dasharray="2 2" opacity="0.6" />
                <!-- 鎖骨 -->
                <path d="M 100,68 C 88,67 76,70 68,74 M 100,68 C 112,67 124,70 132,74" stroke-width="0.9" />
                <!-- 大胸筋 -->
                <path d="M 100,95 C 82,93 70,88 66,80 M 100,95 C 118,93 130,88 134,80" stroke-width="0.9" />
                <path d="M 100,108 C 82,108 72,100 68,90 M 100,108 C 118,108 128,100 132,90" stroke-width="0.9" />
                <!-- 腹筋パック -->
                <path d="M 82,122 C 90,124 110,124 118,122" stroke-width="0.8" />
                <path d="M 84,142 C 90,144 110,144 116,142" stroke-width="0.8" />
                <path d="M 86,162 C 92,164 108,164 114,162" stroke-width="0.8" />
                <!-- 腹斜筋・骨盤ライン -->
                <path d="M 72,175 C 82,185 92,195 100,195 C 108,195 118,185 128,175" stroke-width="0.8" />
                <!-- 膝関節（リアルライン） -->
                <circle cx="83" cy="295" r="4" stroke-width="0.8" stroke-dasharray="1 1" />
                <circle cx="117" cy="295" r="4" stroke-width="0.8" stroke-dasharray="1 1" />
              </g>

              <!-- スキャンレーザーアニメーション -->
              <line class="scan-line" x1="10" y1="0" x2="190" y2="0" stroke="rgba(0, 229, 255, 0.85)" stroke-width="1.8" />
            </svg>
          </div>
          <div class="status-tag">BODY SCAN ACTIVE</div>
        </div>

      </section>
    </main>

    <!-- フッターナビゲーション -->
    <nav class="bottom-nav">
      <button class="nav-button active"><span>🏠</span><small>ホーム</small></button>
      <button class="nav-button"><span>💪</span><small>筋トレ</small></button>
      <button class="nav-button"><span>📊</span><small>記録</small></button>
      <button class="nav-button"><span>👤</span><small>ボディ</small></button>
      <button class="nav-button"><span>⚙️</span><small>設定</small></button>
    </nav>
  </div>

  <script src="app.js"></script>
</body>
</html>

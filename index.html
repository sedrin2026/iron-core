<!DOCTYPE html>

<style>
:root{
  --bg:#02060b; --panel:#071421; --panel2:#0a1b2b; --cyan:#20d9ff;
  --cyan2:#66ecff; --purple:#9b5cff; --pink:#ff3fb4; --text:#f3f8ff; --muted:#7d91a6;
  --line:rgba(32,217,255,.42); --shadow:0 0 24px rgba(32,217,255,.12);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:

 linear-gradient(180deg,#03070c,#02050a 70%,#010307);color:var(--text);
 font-family:Inter,"Noto Sans JP",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{overflow-x:hidden}
button,input,select{font:inherit}
button{cursor:pointer}
.app{width:min(100%,760px);margin:auto;padding:14px 14px 94px}
.topbar{height:74px;display:flex;align-items:center;justify-content:space-between;
 border:1px solid rgba(32,217,255,.34);border-radius:18px;padding:10px 16px;
 background:linear-gradient(180deg,rgba(7,20,32,.96),rgba(2,8,14,.96));
 box-shadow:var(--shadow);position:relative;overflow:hidden}
.topbar:after{content:"";position:absolute;inset:0;pointer-events:none;
 background:linear-gradient(110deg,transparent 0 43%,rgba(32,217,255,.08) 50%,transparent 57%)}
.brand{letter-spacing:.13em;font-weight:900;font-size:25px}
.brand span{color:var(--cyan);text-shadow:0 0 16px rgba(32,217,255,.7)}
.brandLogoWrap{flex:1;display:flex;justify-content:center;align-items:center}.brandLogo{display:block;width:min(100%,500px);height:auto;object-fit:contain}.tag{font-size:9px;letter-spacing:.2em;color:var(--muted);margin-top:2px}
.hud{width:34px;height:34px;border:1px solid var(--line);border-radius:10px;display:grid;place-items:center;color:var(--cyan);font-size:18px}
.hero{margin-top:8px;height:clamp(190px,44vw,340px);border:0;border-radius:20px;overflow:hidden;position:relative;
 background:#07111b center/cover no-repeat url("hero-banner-v2.png?v=2");
 box-shadow:0 0 28px rgba(32,217,255,.14),inset 0 0 40px rgba(0,0,0,.35)}
.hero:before{content:"";position:absolute;inset:0;background:center/cover no-repeat url("hero-banner-v2.png?v=2");filter:brightness(1.12) contrast(1.12);z-index:0}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.2),transparent 50%,rgba(0,0,0,.2));z-index:1}
.heroTitle{position:absolute;z-index:2;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;white-space:nowrap;text-shadow:0 2px 18px #000}
.heroTitle b{font-size:clamp(24px,6vw,46px);letter-spacing:.12em}

.section{margin-top:14px}
.wide{width:100%;min-height:92px;border:1px solid var(--cyan);border-radius:18px;
 background:linear-gradient(110deg,#07192a,#0a1624 55%,#06111d);color:var(--text);
 display:flex;align-items:center;gap:16px;padding:16px 20px;position:relative;overflow:hidden;
 box-shadow:0 0 20px rgba(32,217,255,.08)}
.wide:before{display:none!important}
.coach:before{display:none!important}
.wideIcon{width:52px;height:52px;border-radius:14px;border:0;display:grid;place-items:center;
 color:var(--cyan);font-size:26px;background:transparent;box-shadow:none;overflow:hidden}
.wideIcon img{display:block;width:52px;height:52px;object-fit:cover;border-radius:14px}
.wideText{flex:1;text-align:left}.wideText b{display:block;font-size:18px;letter-spacing:.06em}.wideText small{color:var(--muted);font-size:9px;letter-spacing:.16em}
/* PERSONAL BODY PROFILE banner accent */
.wide{border-color:rgba(32,217,255,.34);box-shadow:0 0 20px rgba(155,92,255,.18),0 0 7px rgba(155,92,255,.22)}
.wideText small{color:#ff3fb4;text-shadow:0 0 5px rgba(255,63,180,.65),0 0 10px rgba(255,63,180,.35)}
.chev{font-size:28px;color:var(--cyan)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile{min-width:0;aspect-ratio:1/1;border:1px solid rgba(32,217,255,.48);border-radius:17px;
 background:linear-gradient(145deg,rgba(9,27,43,.96),rgba(3,11,18,.98));display:flex;flex-direction:column;
 align-items:center;justify-content:center;padding:10px;text-align:center;position:relative;overflow:hidden;
 box-shadow:inset 0 0 22px rgba(32,217,255,.035);transition:.18s}
.tile:before{content:"";position:absolute;inset:5px;border:1px solid rgba(32,217,255,.08);border-radius:12px;pointer-events:none}
.tile:active{transform:scale(.97);border-color:var(--cyan);box-shadow:0 0 18px rgba(32,217,255,.22)}
.tile .ico{font-size:32px;line-height:1;color:var(--cyan);filter:drop-shadow(0 0 7px rgba(32,217,255,.55));margin-bottom:12px}
.tile b{font-size:13px;white-space:nowrap}.tile small{font-size:8px;letter-spacing:.11em;color:var(--muted);margin-top:4px;white-space:nowrap}
.coach{border-color:rgba(155,92,255,.72);background:linear-gradient(110deg,#0c1024,#08182a,#120c23);
 box-shadow:0 0 24px rgba(155,92,255,.12)}
.coach .wideIcon{border-color:var(--purple);color:#cba9ff;box-shadow:0 0 18px rgba(155,92,255,.2)}
.coach .wideText b{color:#d9c6ff}.coach .wideText small{color:#a88bd2}
.coachCard{margin-top:10px;border:1px solid rgba(155,92,255,.4);border-radius:16px;padding:14px;background:rgba(7,9,20,.75)}
/* AI COACH BANNER IMAGE — replace only the button visual; keep existing click/functionality */
.coachImageButton{
  display:block!important;
  width:100%!important;
  padding:0!important;
  border:0!important;
  border-radius:16px!important;
  background:transparent!important;
  box-shadow:none!important;
  overflow:hidden!important;
  line-height:0!important;
  position:relative!important;
}
/* AI COACH left icon: vivid animated rainbow neon glow — source image unchanged */
.coachImageButton:before{
  content:"";
  position:absolute;
  left:-2%;
  top:-8%;
  width:31%;
  height:116%;
  pointer-events:none;
  z-index:2;
  background:
    radial-gradient(circle at 50% 50%,rgba(255,255,255,.32) 0 7%,transparent 18%),
    conic-gradient(from 0deg,#00eaff,#35ff72,#fff02e,#ff3b8d,#b64cff,#27bfff,#00eaff);
  opacity:.72;
  mix-blend-mode:screen;
  -webkit-mask-image:radial-gradient(ellipse 43% 48% at 50% 50%,#000 0%,#000 34%,rgba(0,0,0,.92) 53%,transparent 78%);
  mask-image:radial-gradient(ellipse 43% 48% at 50% 50%,#000 0%,#000 34%,rgba(0,0,0,.92) 53%,transparent 78%);
  filter:blur(4px) saturate(2.1) brightness(1.35);
  background-size:100% 100%;
  animation:aiRainbowSpin 3.2s linear infinite, aiRainbowPulse 1.45s ease-in-out infinite alternate;
}
.coachImageButton:after{
  content:"";
  position:absolute;
  left:0;
  top:0;
  width:30%;
  height:100%;
  pointer-events:none;
  z-index:3;
  background:linear-gradient(110deg,
    rgba(0,234,255,.0) 0%,
    rgba(0,234,255,.75) 16%,
    rgba(53,255,114,.72) 31%,
    rgba(255,240,46,.78) 45%,
    rgba(255,59,141,.78) 62%,
    rgba(182,76,255,.75) 78%,
    rgba(39,191,255,.0) 100%);
  opacity:.82;
  mix-blend-mode:screen;
  -webkit-mask-image:radial-gradient(ellipse 45% 50% at 50% 50%,#000 0%,#000 38%,rgba(0,0,0,.88) 57%,transparent 80%);
  mask-image:radial-gradient(ellipse 45% 50% at 50% 50%,#000 0%,#000 38%,rgba(0,0,0,.88) 57%,transparent 80%);
  filter:blur(3px) saturate(2.25) brightness(1.3);
  background-size:240% 100%;
  animation:aiRainbowSweep 2.2s ease-in-out infinite alternate;
}
@keyframes aiRainbowSpin{
  from{transform:rotate(0deg) scale(1.02)}
  to{transform:rotate(360deg) scale(1.02)}
}
@keyframes aiRainbowPulse{
  from{opacity:.55;filter:blur(5px) saturate(1.8) brightness(1.1)}
  to{opacity:.92;filter:blur(2px) saturate(2.5) brightness(1.55)}
}
@keyframes aiRainbowSweep{
  from{background-position:0% 50%;transform:scaleX(.92)}
  to{background-position:100% 50%;transform:scaleX(1.06)}
}
.coachImageButton:active{
  transform:scale(.985);
  border:0!important;
  box-shadow:none!important;
}
.coachBannerImage{
  display:block;
  width:100%;
  height:auto;
  border:0;
  border-radius:16px;
  object-fit:contain;
  pointer-events:none;
}

.settingsGroup{border:1px solid rgba(32,217,255,.22);border-radius:16px;background:linear-gradient(145deg,#071725,#030b13);padding:13px;margin-bottom:10px;box-shadow:0 0 18px rgba(32,217,255,.045)}
.settingsGroup h3{margin:0 0 10px;color:var(--cyan);font-size:12px;letter-spacing:.12em;font-weight:900}
.settingsItem{display:flex;align-items:center;gap:10px;padding:12px 0;border-top:1px solid rgba(32,217,255,.10);min-height:48px;box-sizing:border-box}
.settingsItem:first-of-type{border-top:0}
.settingsIcon{width:34px;flex:none;text-align:center;color:var(--cyan);font-size:22px;line-height:1;text-shadow:0 0 10px rgba(32,217,255,.35)}
.settingsIcon svg{display:block;width:32px;height:32px;margin:0 auto;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 5px rgba(32,217,255,.28))}
.settingsIcon svg circle,.settingsIcon svg rect,.settingsIcon svg path{vector-effect:non-scaling-stroke}
.bodyDataIcon{width:42px;height:42px;display:flex;align-items:center;justify-content:center}
.bodyDataIcon img{display:block;width:42px;height:42px;object-fit:contain;filter:drop-shadow(0 0 5px rgba(32,217,255,.28))}

.settingsIcon svg path,.settingsIcon svg circle,.settingsIcon svg rect{vector-effect:non-scaling-stroke}
.settingsItemText{flex:1;text-align:left;min-width:0}
.settingsItemText b{display:block;font-size:14px;line-height:1.25}
.settingsItemText small{display:block;margin-top:3px;color:var(--muted);font-size:10px;line-height:1.45}
.settingsBtn{border:1px solid rgba(255,63,180,.75);background:rgba(255,63,180,.055);color:#ff8dcd;border-radius:10px;padding:10px 13px;font-size:10px;white-space:nowrap;min-width:76px}
.settingsBtn:active{transform:scale(.97)}
.settingsSelect{background:#06101a;color:#fff;border:1px solid rgba(32,217,255,.34);border-radius:9px;padding:8px 10px;min-width:92px;font-size:11px}
.settingsSwitch{appearance:none;width:46px;height:26px;border:1px solid rgba(32,217,255,.35);border-radius:99px;background:#071421;position:relative;flex:none}
.settingsSwitch:before{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#66788a;transition:.18s}
.settingsSwitch:checked{border-color:var(--cyan);background:rgba(32,217,255,.55)}
.settingsSwitch:checked:before{left:24px;background:#fff;box-shadow:0 0 10px rgba(32,217,255,.55)}
.settingsDanger{border-color:rgba(255,63,180,.48)}
.settingsDanger h3{color:#ff78c9}
.settingsNote{color:var(--muted);font-size:9px;line-height:1.65;margin:5px 0 0}
.settingsResetDesc{font-size:10px !important;line-height:1.55 !important}

  const openProfile = document.getElementById('openProfile');
  const profileModal = document.getElementById('profileModal');
  const closeProfileModal = document.getElementById('closeProfileModal');
  const saveProfileModal = document.getElementById('saveProfileModal');

  if(openProfile && profileModal){
    openProfile.addEventListener('click', () => { profileModal.classList.add('show'); });
  }
  if(closeProfileModal && profileModal){
    closeProfileModal.addEventListener('click', () => { profileModal.classList.remove('show'); });
  }
  if(saveProfileModal && profileModal){
    saveProfileModal.addEventListener('click', () => { profileModal.classList.remove('show'); });
  }
</script>
</body>
</html>

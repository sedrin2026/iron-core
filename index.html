<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>IRON CORE</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <!-- ヘッダー -->
    <header class="app-header">
      <div class="brand">
        <div class="brand-mark">IC</div>
        <div class="brand-text">
          <strong>IRON CORE</strong><br>
          <span>BODY METRICS</span>
        </div>
      </div>
      <button class="icon-button">⚙️</button>
    </header>

    <!-- メイン表示エリア -->
    <main>
      <section class="screen active future-home-screen">
        
        <!-- プロフィール簡易表示 -->
        <div class="body-profile-panel">
          <div class="inline-profile-grid">
            <div class="inline-profile-field">
              <span>身長</span>
              <input type="number" value="170" readonly>
            </div>
            <div class="inline-profile-field">
              <span>体重</span>
              <input type="number" value="65" readonly>
            </div>
            <div class="inline-profile-field">
              <span>体脂肪</span>
              <input type="number" value="15" readonly>
            </div>
            <div class="inline-profile-field">
              <span>BMI</span>
              <input type="number" value="22.5" readonly>
            </div>
            <button class="inline-profile-save">編集</button>
          </div>
        </div>

        <!-- ワイヤーフレーム表示ステージ -->
        <div class="body-core-stage single-body-stage">
          <div class="wireframe-container">
            <svg class="cyber-wireframe" viewBox="0 0 200 420" xmlns="http://www.w3.org/2000/svg">
              <defs>
                <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
                  <feGaussianBlur stdDeviation="2" result="blur" />
                  <feMerge>
                    <feMergeNode in="blur" />
                    <feMergeNode in="SourceGraphic" />
                  </feMerge>
                </filter>
              </defs>

              <g stroke="#00e5ff" stroke-width="1.2" fill="none" filter="url(#glow)">
                <!-- 頭部 -->
                <polygon points="100,20 112,28 110,48 100,56 90,48 88,28" />
                <line x1="88" y1="28" x2="112" y2="28" />
                <line x1="90" y1="48" x2="110" y2="48" />
                <line x1="100" y1="20" x2="100" y2="56" />

                <!-- 胸部・腹部 -->
                <polygon points="100,68 60,78 68,125 100,135 132,125 140,78" />
                <line x1="100" y1="68" x2="100" y2="195" />
                <line x1="60" y1="78" x2="140" y2="78" />
                <polygon points="100,135 68,125 74,185 100,195 126,185 132,125" />
                <line x1="70" y1="145" x2="130" y2="145" />

                <!-- 腕（左右） -->
                <polygon points="60,78 42,88 48,135 68,125" />
                <polygon points="42,88 28,140 38,185 48,135" />
                <polygon points="140,78 158,88 152,125 132,125" />
                <polygon points="158,88 172,140 162,185 152,135" />

                <!-- 脚（左右） -->
                <polygon points="100,195 74,185 80,225 100,235 120,225 126,185" />
                <polygon points="80,225 100,235 94,310 72,310" />
                <polygon points="72,310 94,310 90,385 76,385" />
                <polygon points="120,225 100,235 106,310 128,310" />
                <polygon points="128,310 106,310 110,385 124,385" />

                <!-- 関節ノード -->
                <g fill="#00e5ff" stroke="none">
                  <circle cx="60" cy="78" r="3" />
                  <circle cx="140" cy="78" r="3" />
                  <circle cx="80" cy="225" r="3" />
                  <circle cx="120" cy="225" r="3" />
                </g>
              </g>

              <!-- スキャン線 -->
              <line class="scan-line" x1="10" y1="0" x2="190" y2="0" stroke="rgba(0, 229, 255, 0.8)" stroke-width="2" />
            </svg>
          </div>
          <div class="body-stage-hint">SYSTEM READY</div>
        </div>

      </section>
    </main>

    <!-- 下部ナビゲーション -->
    <nav class="bottom-nav">
      <button class="nav-button active"><span>🏠</span><small>ホーム</small></button>
      <button class="nav-button"><span>💪</span><small>筋トレ</small></button>
      <button class="nav-button"><span>📊</span><small>記録</small></button>
      <button class="nav-button"><span>👤</span><small>ボディ</small></button>
      <button class="nav-button"><span>⚙️</span><small>設定</small></button>
    </nav>
  </div>

  <script src="app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>IRON CORE</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <!-- ヘッダー -->
    <header class="app-header">
      <div class="brand">
        <div class="brand-mark">IC</div>
        <div class="brand-text">
          <strong>IRON CORE</strong><br>
          <span>SYSTEM ONLINE</span>
        </div>
      </div>
      <button class="icon-button">⚙️</button>
    </header>

    <!-- メインコンテンツエリア -->
    <main>
      <section class="screen active">
        
        <!-- プロフィールパネル -->
        <div class="body-profile-panel">
          <div class="inline-profile-grid">
            <div class="inline-profile-field">
              <span>身長</span>
              <input type="number" value="175">
            </div>
            <div class="inline-profile-field">
              <span>体重</span>
              <input type="number" value="70">
            </div>
            <div class="inline-profile-field">
              <span>体脂肪</span>
              <input type="number" value="14">
            </div>
            <div class="inline-profile-field">
              <span>BMI</span>
              <input type="number" value="22.8" readonly>
            </div>
            <button class="inline-profile-save">保存</button>
          </div>
        </div>

        <!-- ホログラム画像表示エリア（ここでサイズや大きさを自由に変更できます） -->
        <div class="wireframe-card" style="display: flex; flex-direction: column; align-items: center; justify-content: center; background: #050b14; padding: 15px; border-radius: 12px; border: 1px solid #00e5ff33;">
          
          <!-- 画像を小さくしたい時は max-width の数値（例: 260px など）を小さくしてね！ -->
          <img src="hologram.png" alt="IRON CORE Hologram" style="width: 100%; max-width: 280px; height: auto; border-radius: 8px; box-shadow: 0 0 20px rgba(0, 229, 255, 0.3);">
          
          <div class="status-tag" style="margin-top: 10px;">STATUS: 100% | SCAN MODE: ACTIVE</div>
        </div>

      </section>
    </main>

    <!-- フッターナビゲーション -->
    <nav class="bottom-nav">
      <button class="nav-button active"><span>🏠</span><small>ホーム</small></button>
      <button class="nav-button"><span>💪</span><small>筋トレ</small></button>
      <button class="nav-button"><span>📊</span><small>記録</small></button>
      <button class="nav-button"><span>👤</span><small>ボディ</small></button>
      <button class="nav-button"><span>⚙️</span><small>設定</small></button>
    </nav>
  </div>
</body>
</html>

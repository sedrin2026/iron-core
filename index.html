<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>IRON CORE</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <!-- ヘッダー -->
    <header class="app-header">
      <div class="brand">
        <div class="brand-mark">IC</div>
        <div class="brand-text">
          <strong>IRON CORE</strong><br>
          <span>SYSTEM ONLINE</span>
        </div>
      </div>
      <button class="icon-button">⚙️</button>
    </header>

    <!-- メインコンテンツエリア -->
    <main>
      <section class="screen active">
        
        <!-- プロフィールパネル -->
        <div class="body-profile-panel">
          <div class="inline-profile-grid">
            <div class="inline-profile-field">
              <span>身長</span>
              <input type="number" value="175">
            </div>
            <div class="inline-profile-field">
              <span>体重</span>
              <input type="number" value="70">
            </div>
            <div class="inline-profile-field">
              <span>体脂肪</span>
              <input type="number" value="14">
            </div>
            <div class="inline-profile-field">
              <span>BMI</span>
              <input type="number" value="22.8" readonly>
            </div>
            <button class="inline-profile-save">保存</button>
          </div>
        </div>

        <!-- ホログラム回転 ＆ 部位タップエリア -->
        <div class="wireframe-card">
          <div class="flip-hint">💡 タップで表裏回転 / 部位タップで種目表示</div>
          
          <!-- 3D回転用コンテナ -->
          <div class="flip-container" id="flip-container">
            <div class="flipper">
              
              <!-- 表面：正面モデル -->
              <div class="front">
                <img src="hologram.png" alt="Front Model">
                <!-- タップ判定ボタン（透明） -->
                <div class="touch-zone chest" onclick="showExercises('胸')"></div>
                <div class="touch-zone abs" onclick="showExercises('腹筋')"></div>
                <div class="touch-zone arms-l" onclick="showExercises('腕')"></div>
                <div class="touch-zone arms-r" onclick="showExercises('腕')"></div>
                <div class="touch-zone legs" onclick="showExercises('脚')"></div>
              </div>

              <!-- 裏面：背面モデル -->
              <div class="back">
                <img src="hologram_back.jpg" alt="Back Model">
                <!-- タップ判定ボタン（透明） -->
                <div class="touch-zone upper-back" onclick="showExercises('背中上部')"></div>
                <div class="touch-zone lower-back" onclick="showExercises('腰・背筋')"></div>
                <div class="touch-zone glutes" onclick="showExercises('臀部')"></div>
              </div>

            </div>
          </div>

          <!-- 回転ボタン -->
          <button class="rotate-btn" onclick="toggleFlip()">🔄 表/裏 切り替え</button>
          
          <div class="status-tag">STATUS: 100% | SCAN MODE: ACTIVE</div>
        </div>

      </section>
    </main>

    <!-- 部位タップ時の筋トレ種目モーダル -->
    <div id="exercise-modal" class="modal">
      <div class="modal-content">
        <h3 id="modal-title">部位名</h3>
        <ul id="exercise-list"></ul>
        <button class="close-btn" onclick="closeModal()">閉じる</button>
      </div>
    </div>

    <!-- フッターナビゲーション -->
    <nav class="bottom-nav">
      <button class="nav-button active"><span>🏠</span><small>ホーム</small></button>
      <button class="nav-button"><span>💪</span><small>筋トレ</small></button>
      <button class="nav-button"><span>📊</span><small>記録</small></button>
      <button class="nav-button"><span>👤</span><small>ボディ</small></button>
      <button class="nav-button"><span>⚙️</span><small>設定</small></button>
    </nav>
  </div>

  <script src="app.js"></script>
</body>
</html>

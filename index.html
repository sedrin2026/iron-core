<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>IRON CORE</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <!-- ヘッダー -->
    <header class="app-header">
      <div class="brand">
        <div class="brand-mark">IC</div>
        <div class="brand-text">
          <strong>IRON CORE</strong><br>
          <span>BODY METRICS</span>
        </div>
      </div>
      <button class="icon-button">⚙️</button>
    </header>

    <!-- メインコンテンツエリア -->
    <main>
      <section class="screen active">
        
        <!-- プロフィールパネル -->
        <div class="body-profile-panel">
          <div class="inline-profile-grid">
            <div class="inline-profile-field">
              <span>身長</span>
              <input type="number" value="175">
            </div>
            <div class="inline-profile-field">
              <span>体重</span>
              <input type="number" value="78">
            </div>
            <div class="inline-profile-field">
              <span>体脂肪</span>
              <input type="number" value="12">
            </div>
            <div class="inline-profile-field">
              <span>BMI</span>
              <input type="number" value="25.4" readonly>
            </div>
            <button class="inline-profile-save">保存</button>
          </div>
        </div>

        <!-- 筋肉質なリアル人型ワイヤーフレーム表示領域 -->
        <div class="wireframe-card">
          <div class="wireframe-container">
            <svg class="cyber-wireframe" viewBox="0 0 200 440" xmlns="http://www.w3.org/2000/svg">
              <defs>
                <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
                  <feGaussianBlur stdDeviation="1.5" result="blur" />
                  <feMerge>
                    <feMergeNode in="blur" />
                    <feMergeNode in="SourceGraphic" />
                  </feMerge>
                </filter>
              </defs>

              <g stroke="#00e5ff" fill="none" filter="url(#glow)">
                <!-- マッチョなリアル人体アウトライン -->
                <path d="
                  M 100,20 
                  C 108,20 115,26 115,38 
                  C 115,50 108,56 100,58 
                  C 92,56 85,50 85,38 
                  C 85,26 92,20 100,20 Z
                  
                  M 88,56 C 88,64 74,68 60,70 C 50,72 40,82 36,98 C 32,112 36,132 30,152 C 25,170 20,190 22,208 C 24,213 32,213 36,202 C 42,185 45,160 48,142 C 50,132 58,128 60,138 C 65,158 68,188 72,202 C 75,212 78,222 75,235 C 70,250 62,270 60,290 C 57,315 62,345 66,370 C 69,388 67,408 62,420 C 60,424 65,426 72,426 C 80,426 84,418 86,398 C 90,368 93,330 92,298 C 92,268 97,248 100,242
                  C 103,248 108,268 108,298 C 107,330 110,368 114,398 C 116,418 120,426 128,426 C 135,426 140,424 138,420 C 133,408 131,388 134,370 C 138,345 143,315 140,290 C 138,270 130,250 125,235 C 122,222 125,212 128,202 C 132,188 135,158 140,138 C 142,128 150,132 152,142 C 155,160 158,185 164,202 C 168,213 176,213 178,208 C 180,190 175,170 170,152 C 164,132 168,112 164,98 C 160,82 150,72 140,70 C 126,68 112,64 112,56
                " stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" />

                <!-- 筋肉のディテールライン -->
                <path d="M 100,58 L 100,225" stroke-width="0.8" stroke-dasharray="3 2" opacity="0.5" />
                <!-- 僧帽筋・鎖骨 -->
                <path d="M 100,66 C 85,64 70,68 60,70 M 100,66 C 115,64 130,68 140,70" stroke-width="1.0" />
                <!-- 三角筋（肩のメロン） -->
                <path d="M 60,70 C 48,76 38,88 42,102 M 140,70 C 152,76 162,88 158,102" stroke-width="1.0" />
                <!-- 厚い大胸筋 -->
                <path d="M 100,102 C 78,100 62,94 56,82 M 100,102 C 122,100 138,94 144,82" stroke-width="1.1" />
                <path d="M 100,118 C 76,118 64,108 58,95 M 100,118 C 124,118 136,108 142,95" stroke-width="1.1" />
                <!-- 腹直筋（6パック） -->
                <path d="M 76,132 C 88,135 112,135 124,132" stroke-width="0.9" />
                <path d="M 78,154 C 88,157 112,157 122,154" stroke-width="0.9" />
                <path d="M 80,176 C 88,179 112,179 120,176" stroke-width="0.9" />
                <!-- 前鋸肌・外腹斜筋 -->
                <path d="M 58,122 C 68,128 72,136 76,140 M 142,122 C 132,128 128,136 124,140" stroke-width="0.8" />
                <!-- 骨盤・Vライン -->
                <path d="M 68,190 C 80,202 92,208 100,208 C 108,208 120,202 132,190" stroke-width="0.9" />
                <!-- 大腿四頭筋（太もも） -->
                <path d="M 75,235 C 85,250 88,275 88,292 M 125,235 C 115,250 112,275 112,292" stroke-width="0.9" />
                <!-- 膝蓋骨（ひざ） -->
                <circle cx="82" cy="302" r="4.5" stroke-width="0.8" stroke-dasharray="2 1" />
                <circle cx="118" cy="302" r="4.5" stroke-width="0.8" stroke-dasharray="2 1" />
                <!-- 腓腹肌（ふくらはぎ） -->
                <path d="M 64,330 C 60,348 64,365 68,375 M 136,330 C 140,348 136,365 132,375" stroke-width="0.8" />
              </g>

              <!-- スキャンレーザー -->
              <line class="scan-line" x1="10" y1="0" x2="190" y2="0" stroke="rgba(0, 229, 255, 0.9)" stroke-width="2" />
            </svg>
          </div>
          <div class="status-tag">MUSCLE SCAN COMPLETE</div>
        </div>

      </section>
    </main>

    <!-- フッターナビゲーション -->
    <nav class="bottom-nav">
      <button class="nav-button active"><span>🏠</span><small>ホーム</small></button>
      <button class="nav-button"><span>💪</span><small>筋トレ</small></button>
      <button class="nav-button"><span>📊</span><small>記録</small></button>
      <button class="nav-button"><span>👤</span><small>ボディ</small></button>
      <button class="nav-button"><span>⚙️</span><small>設定</small></button>
    </nav>
  </div>

  <script src="app.js"></script>
</body>
</html>

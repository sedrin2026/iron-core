<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>IRON CORE</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <!-- ヘッダー -->
    <header class="app-header">
      <div class="brand">
        <div class="brand-mark">IC</div>
        <div class="brand-text">
          <strong>IRON CORE</strong><br>
          <span>SYSTEM ONLINE</span>
        </div>
      </div>
      <button class="icon-button">⚙️</button>
    </header>

    <!-- メインコンテンツエリア -->
    <main>
      <section class="screen active">
        
        <!-- プロフィールパネル -->
        <div class="body-profile-panel">
          <div class="inline-profile-grid">
            <div class="inline-profile-field">
              <span>身長</span>
              <input type="number" value="175">
            </div>
            <div class="inline-profile-field">
              <span>体重</span>
              <input type="number" value="70">
            </div>
            <div class="inline-profile-field">
              <span>体脂肪</span>
              <input type="number" value="14">
            </div>
            <div class="inline-profile-field">
              <span>BMI</span>
              <input type="number" value="22.8" readonly>
            </div>
            <button class="inline-profile-save">保存</button>
          </div>
        </div>

        <!-- リアルホログラム・筋肉メッシュワイヤーフレーム -->
        <div class="wireframe-card">
          <div class="wireframe-container">
            <svg class="cyber-wireframe" viewBox="0 0 200 460" xmlns="http://www.w3.org/2000/svg">
              <defs>
                <!-- 発光エフェクト -->
                <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
                  <feGaussianBlur stdDeviation="1.8" result="blur" />
                  <feMerge>
                    <feMergeNode in="blur" />
                    <feMergeNode in="SourceGraphic" />
                  </feMerge>
                </filter>
              </defs>

              <!-- 足元SFグラフィック（円形台座） -->
              <g stroke="#00e5ff" fill="none" opacity="0.6">
                <ellipse cx="100" cy="425" rx="80" ry="12" stroke-width="0.8" stroke-dasharray="4 2" />
                <ellipse cx="100" cy="425" rx="60" ry="9" stroke-width="0.6" />
                <ellipse cx="100" cy="425" rx="40" ry="6" stroke-width="0.5" stroke-dasharray="2 2" />
                <circle cx="100" cy="425" r="2" fill="#00e5ff" filter="url(#glow)" />
              </g>

              <!-- 人体メッシュ・ポリゴン（高精細リアル構造） -->
              <g stroke="#00e5ff" stroke-width="0.6" fill="rgba(0, 229, 255, 0.02)" filter="url(#glow)">
                
                <!-- 1. リアル頭部・顔メッシュ -->
                <path d="M 100,15 C 109,15 116,21 116,34 C 116,46 108,54 100,56 C 92,54 84,46 84,34 C 84,21 91,15 100,15 Z" stroke-width="1.0" />
                <!-- 顔横・縦線（メッシュ） -->
                <path d="M 84,30 C 92,34 108,34 116,30 M 86,40 C 94,45 106,45 114,40 M 88,48 C 95,51 105,51 112,48" stroke-width="0.5" />
                <path d="M 100,15 L 100,56 M 92,20 C 94,32 94,44 94,52 M 108,20 C 106,32 106,44 106,52" stroke-width="0.4" />

                <!-- 2. 首・僧帽筋 -->
                <path d="M 94,54 C 92,62 80,68 64,72 M 106,54 C 108,62 120,68 136,72" stroke-width="0.9" />
                <path d="M 97,55 L 97,70 M 103,55 L 103,70" stroke-width="0.4" />

                <!-- 3. 三角筋（メロン肩） -->
                <path d="M 64,72 C 50,78 38,90 42,106 C 45,118 52,122 58,122 M 136,72 C 150,78 162,90 158,106 C 155,118 148,122 142,122" stroke-width="0.9" />
                <path d="M 58,75 C 48,85 45,98 52,112 M 142,75 C 152,85 155,98 148,112" stroke-width="0.4" />

                <!-- 4. 厚い大胸筋＆網目 -->
                <path d="M 100,70 L 100,122" stroke-width="0.8" />
                <path d="M 100,102 C 78,98 58,92 52,80 M 100,102 C 122,98 142,92 148,80" stroke-width="0.9" />
                <path d="M 100,122 C 78,122 60,112 56,98 M 100,122 C 122,122 140,112 144,98" stroke-width="0.9" />
                <!-- 胸筋横メッシュ -->
                <path d="M 60,86 C 80,88 120,88 140,86 M 58,94 C 80,98 120,98 142,94 M 56,108 C 78,112 122,112 144,108" stroke-width="0.4" />
                <!-- 胸筋縦メッシュ -->
                <path d="M 72,78 C 72,92 74,108 78,118 M 86,74 C 86,90 88,108 90,120 M 128,78 C 128,92 126,108 122,118 M 114,74 C 114,90 112,108 110,120" stroke-width="0.4" />

                <!-- 5. 腹筋 8パック＆側腹筋 -->
                <path d="M 100,122 L 100,215" stroke-width="0.7" />
                <path d="M 72,138 C 88,141 112,141 128,138" stroke-width="0.7" />
                <path d="M 74,158 C 88,161 112,161 126,158" stroke-width="0.7" />
                <path d="M 76,178 C 88,181 112,181 124,178" stroke-width="0.7" />
                <path d="M 78,198 C 88,201 112,201 122,198" stroke-width="0.7" />
                <!-- 腹筋縦ライン -->
                <path d="M 86,124 C 86,150 88,180 90,205 M 114,124 C 114,150 112,180 110,205" stroke-width="0.4" />

                <!-- 6. 腕（上腕・前腕・手持ちスタイル） -->
                <!-- 左腕 -->
                <path d="M 42,106 C 36,125 32,150 28,172 C 24,188 20,205 24,220 C 26,225 32,225 35,215 C 40,198 44,175 48,155 C 52,140 58,122 58,122" stroke-width="0.8" />
                <!-- 右腕 -->
                <path d="M 158,106 C 164,125 168,150 172,172 C 176,188 180,205 176,220 C 174,225 168,225 165,215 C 160,198 156,175 152,155 C 148,140 142,122 142,122" stroke-width="0.8" />
                <!-- 腕のグリッド横線 -->
                <path d="M 48,120 L 38,122 M 46,140 L 34,142 M 42,160 L 30,165 M 38,180 L 26,185 M 35,200 L 22,205" stroke-width="0.4" />
                <path d="M 152,120 L 162,122 M 154,140 L 166,142 M 158,160 L 170,165 M 162,180 L 174,185 M 165,200 L 178,205" stroke-width="0.4" />

                <!-- 7. 骨盤・太もも（大腿四頭筋） -->
                <path d="M 68,195 C 80,210 92,218 100,218 C 108,218 120,210 132,195" stroke-width="0.8" />
                <!-- 左脚 -->
                <path d="M 68,195 C 62,230 64,270 66,305 C 68,328 66,360 62,390 C 60,405 60,418 68,422 C 76,422 82,418 84,402 C 88,370 91,330 90,298 C 90,265 96,238 100,225" stroke-width="0.8" />
                <!-- 右脚 -->
                <path d="M 132,195 C 138,230 136,270 134,305 C 132,328 134,360 138,390 C 140,405 140,418 132,422 C 124,422 118,418 116,402 C 112,370 109,330 110,298 C 110,265 104,238 100,225" stroke-width="0.8" />

                <!-- 脚の立体グリッドメッシュ（縦横交差） -->
                <path d="M 65,225 C 80,230 90,230 98,225 M 64,250 C 80,256 90,256 96,250 M 65,275 C 80,282 90,282 94,275 M 66,300 C 78,306 88,306 91,300 M 64,330 C 76,335 85,335 88,330 M 63,360 C 74,365 83,365 86,360 M 62,390 C 72,395 80,395 84,390" stroke-width="0.4" />
                <path d="M 135,225 C 120,230 110,230 102,225 M 136,250 C 120,256 110,256 104,250 M 135,275 C 120,282 110,282 106,275 M 134,300 C 122,306 112,306 109,300 M 136,330 C 124,335 115,335 112,330 M 137,360 C 126,365 117,365 114,360 M 138,390 C 128,395 120,395 116,390" stroke-width="0.4" />
                <path d="M 80,215 C 78,260 78,320 74,400 M 120,215 C 122,260 122,320 126,400" stroke-width="0.4" />

              </g>

              <!-- スキャンレーザー -->
              <line class="scan-line" x1="10" y1="0" x2="190" y2="0" stroke="rgba(0, 229, 255, 0.95)" stroke-width="2" />
            </svg>
          </div>
          <div class="status-tag">STATUS: 100% | SCAN MODE: ACTIVE</div>
        </div>

      </section>
    </main>

    <!-- フッターナビゲーション -->
    <nav class="bottom-nav">
      <button class="nav-button active"><span>🏠</span><small>ホーム</small></button>
      <button class="nav-button"><span>💪</span><small>筋トレ</small></button>
      <button class="nav-button"><span>📊</span><small>記録</small></button>
      <button class="nav-button"><span>👤</span><small>ボディ</small></button>
      <button class="nav-button"><span>⚙️</span><small>設定</small></button>
    </nav>
  </div>

  <script src="app.js"></script>
</body>
</html>
